name: PROMISE BOX Cloudflare isolation (local only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - run: npm ci --prefix mvp --ignore-scripts
      - run: npm ci --prefix cloudflare --ignore-scripts
      - run: node harness/check.mjs
      - run: node --test harness/check.test.mjs harness/cloudflare-isolation.test.mjs
      - run: npm test --prefix cloudflare
      # No Cloudflare credentials, deploy command, remote inventory collection,
      # resource mutation, production test, or automatic push/PR trigger.
      # Synthetic PASS never authorizes deployment. Dispatch requires its own
      # authorization; this local task does not dispatch the workflow.
