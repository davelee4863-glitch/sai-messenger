name: PROMISE BOX mutual consent UI (tests only)
on:
  push:
    branches: [feat/promise-box-consent-ui-20261015]
  pull_request:
    branches: [feat/promise-box-dependency-security-20261014]
permissions:
  contents: read
jobs:
  consent-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - run: npm ci --prefix mvp --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix cloudflare --ignore-scripts --no-audit --no-fund
      - name: Live dependency audit
        run: |
          mkdir -p cloudflare/.local/security
          npm audit --prefix cloudflare --json > cloudflare/.local/security/audit.json
      - run: node harness/check.mjs
      - name: Complete suite including the frozen 442-case baseline
        run: node harness/cloudflare-ci.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutual-consent-ui-evidence
          path: |
            cloudflare/.local/ci/
            cloudflare/.local/security/
          if-no-files-found: error
      # Test-only CI. No cloud credentials, resource writes, or deployments.
