name: PROMISE BOX V2 accessibility candidate (tests only)
on:
  push:
    branches: [fix/promise-box-v2-a11y-20261015]
  pull_request:
    branches: [ui/promise-box-emotional-v2-20261015]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - run: npm ci --prefix mvp --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix cloudflare --ignore-scripts --no-audit --no-fund
      - run: npm audit --prefix cloudflare
      - run: node harness/check.mjs
      - run: node harness/ui-v2-ci.mjs
      - name: Build local candidate evidence only
        run: node scripts/build-ui-v2.mjs "$RUNNER_TEMP/pm022-candidate"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pm022-test-evidence
          path: |
            cloudflare/.local/v2-ci/
            ${{ runner.temp }}/pm022-candidate/
          if-no-files-found: error
