name: PROMISE BOX private staging validation
on:
  push:
    branches: [feat/promise-box-private-staging-v1]
  pull_request:
    branches: [main, feat/promise-box-core-mvp-20261013]
    paths: [mvp/**, harness/private-staging-rules.json, harness/incidents.json, .github/workflows/private-staging.yml, .gitignore]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - run: npm ci --prefix mvp --ignore-scripts --no-fund --no-audit
      - run: node harness/check.mjs
      - run: node --test harness/check.test.mjs tests/ui-state.test.mjs tests/ui-static.test.mjs tests/ui-qr.test.mjs tests/ui-build.test.mjs tests/ui-pages-environment.test.mjs mvp/tests/*.test.mjs
